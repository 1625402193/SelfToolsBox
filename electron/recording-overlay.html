<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<style>
* { margin: 0; padding: 0; box-sizing: border-box; }
html, body {
  width: 100vw; height: 100vh;
  overflow: hidden;
  background: transparent;
  pointer-events: none;
  user-select: none;
}
.dim {
  position: fixed;
  background: rgba(0, 0, 0, 0.55);
  pointer-events: none;
}
.border {
  position: fixed;
  border: 2px solid #ff4d4f;
  box-sizing: border-box;
  pointer-events: none;
  animation: pulse 1.5s ease-in-out infinite;
}
@keyframes pulse {
  0%, 100% { box-shadow: 0 0 0 1px rgba(255,77,79,0.3); }
  50%      { box-shadow: 0 0 14px 3px rgba(255,77,79,0.85); }
}
.label {
  position: fixed;
  background: #ff4d4f;
  color: #fff;
  padding: 3px 10px;
  font-size: 12px;
  font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", "Microsoft YaHei", sans-serif;
  border-radius: 3px 3px 0 0;
  pointer-events: none;
  white-space: nowrap;
}
.label .dot {
  display: inline-block;
  width: 8px; height: 8px;
  background: #fff;
  border-radius: 50%;
  margin-right: 6px;
  vertical-align: middle;
  animation: blink 1s ease-in-out infinite;
}
@keyframes blink {
  0%, 100% { opacity: 1; }
  50%      { opacity: 0.2; }
}
</style>
</head>
<body>
<div id="dim-top" class="dim"></div>
<div id="dim-bottom" class="dim"></div>
<div id="dim-left" class="dim"></div>
<div id="dim-right" class="dim"></div>
<div id="border" class="border"></div>
<div id="label" class="label"><span class="dot"></span><span id="label-text">REC</span></div>
<script>
(function () {
  var p = new URLSearchParams(window.location.search);
  var x = parseInt(p.get('x') || '0', 10);
  var y = parseInt(p.get('y') || '0', 10);
  var w = parseInt(p.get('w') || '0', 10);
  var h = parseInt(p.get('h') || '0', 10);

  var top = document.getElementById('dim-top');
  top.style.left = '0';
  top.style.top = '0';
  top.style.width = '100vw';
  top.style.height = y + 'px';

  var bottom = document.getElementById('dim-bottom');
  bottom.style.left = '0';
  bottom.style.top = (y + h) + 'px';
  bottom.style.width = '100vw';
  bottom.style.bottom = '0';

  var left = document.getElementById('dim-left');
  left.style.left = '0';
  left.style.top = y + 'px';
  left.style.width = x + 'px';
  left.style.height = h + 'px';

  var right = document.getElementById('dim-right');
  right.style.left = (x + w) + 'px';
  right.style.top = y + 'px';
  right.style.right = '0';
  right.style.height = h + 'px';

  // 红框紧贴区域外侧 2px，保证内 region 干净不被框线染色
  var border = document.getElementById('border');
  border.style.left = (x - 2) + 'px';
  border.style.top = (y - 2) + 'px';
  border.style.width = (w + 4) + 'px';
  border.style.height = (h + 4) + 'px';

  // "REC" 标签贴在区域外侧（顶部优先，否则底部），避免落入录制区域
  var label = document.getElementById('label');
  label.style.left = x + 'px';
  if (y >= 26) {
    label.style.top = (y - 24) + 'px';
  } else {
    label.style.top = (y + h + 4) + 'px';
  }
  document.getElementById('label-text').textContent = '录制中 ' + w + '×' + h;
})();
</script>
</body>
</html>
